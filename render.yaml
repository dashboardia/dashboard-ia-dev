previews:
  generation: off

services:
  - type: web
    name: dashboard-ia-standby
    runtime: node
    plan: free
    region: oregon
    branch: main-render
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_ID
        sync: false
      - key: GITHUB_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_GITHUB_LOGIN
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: ASAAS_ENVIRONMENT
        value: sandbox
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: PREVIEW_HOST_URL
        sync: false
      - key: PREVIEW_HOST_TOKEN
        sync: false
      - key: PREVIEW_TTL_MINUTES
        value: "60"

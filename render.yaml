previews:
  generation: off

services:
  - type: web
    name: dashboard-ia-standby
    runtime: node
    plan: free
    region: oregon
    branch: main-render
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_ID
        sync: false
      - key: GITHUB_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_GITHUB_LOGIN
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: ASAAS_ENVIRONMENT
        value: sandbox
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: BILLING_CONTACT_URL
        sync: false
      - key: RAILWAY_API_TOKEN
        sync: false
      - key: BUCKET_ENDPOINT
        sync: false
      - key: BUCKET_NAME
        sync: false
      - key: BUCKET_ACCESS_KEY_ID
        sync: false
      - key: BUCKET_SECRET_ACCESS_KEY
        sync: false

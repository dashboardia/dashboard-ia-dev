services:
  preview-host:
    container_name: dashboardia-preview-host
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      PREVIEW_HOST_TOKEN: ${PREVIEW_HOST_TOKEN}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.dashboardia.app}
      PREVIEW_API_DOMAIN: ${PREVIEW_API_DOMAIN:-preview-api.dashboardia.app}
      PREVIEW_HOST_CONTAINER_NAME: dashboardia-preview-host
      PREVIEW_DATA_DIRECTORY: /var/lib/dashboardia-previews
      PREVIEW_MAX_ARCHIVE_MB: "64"
      PREVIEW_BUILD_TIMEOUT_MINUTES: "15"
      PREVIEW_MAX_PARALLEL_BUILDS: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - preview-data:/var/lib/dashboardia-previews
    networks:
      - public
      - preview

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.dashboardia.app}
      PREVIEW_API_DOMAIN: ${PREVIEW_API_DOMAIN:-preview-api.dashboardia.app}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - public
      - preview

networks:
  public:
  preview:
    name: dashboardia-preview-control
    internal: true

volumes:
  preview-data:
  caddy-data:
  caddy-config:

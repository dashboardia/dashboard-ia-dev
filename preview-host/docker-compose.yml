services:
  preview-host:
    container_name: dashboardia-preview-host
    build: .
    image: dashboardia-preview-host:local
    restart: unless-stopped
    environment:
      PORT: "8080"
      PREVIEW_HOST_TOKEN: ${PREVIEW_HOST_TOKEN}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.dashboardia.app}
      PREVIEW_API_DOMAIN: ${PREVIEW_API_DOMAIN:-preview-api.dashboardia.app}
      PREVIEW_HOST_CONTAINER_NAME: dashboardia-preview-host
      PREVIEW_DATA_DIRECTORY: /var/lib/dashboardia-previews
      PREVIEW_MAX_ARCHIVE_MB: ${PREVIEW_MAX_ARCHIVE_MB:-512}
      PREVIEW_BUILD_TIMEOUT_MINUTES: ${PREVIEW_BUILD_TIMEOUT_MINUTES:-15}
      PREVIEW_MAX_PARALLEL_BUILDS: ${PREVIEW_MAX_PARALLEL_BUILDS:-2}
      PREVIEW_ALLOW_OUTBOUND_NETWORK: ${PREVIEW_ALLOW_OUTBOUND_NETWORK:-true}
      PREVIEW_PROXY_TIMEOUT_SECONDS: ${PREVIEW_PROXY_TIMEOUT_SECONDS:-60}
      PREVIEW_READY_FAILURE_GRACE_SECONDS: ${PREVIEW_READY_FAILURE_GRACE_SECONDS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - preview-data:/var/lib/dashboardia-previews
    networks:
      - public
      - preview

  validation-host:
    container_name: dashboardia-validation-host
    image: dashboardia-preview-host:local
    command: ["node", "validation-server.mjs"]
    restart: unless-stopped
    depends_on:
      - preview-host
    environment:
      PORT: "8081"
      PREVIEW_HOST_TOKEN: ${PREVIEW_HOST_TOKEN}
      VALIDATION_DATA_DIRECTORY: /var/lib/dashboardia-validations
      VALIDATION_MAX_ARCHIVE_MB: ${VALIDATION_MAX_ARCHIVE_MB:-512}
      VALIDATION_MAX_PARALLEL: ${VALIDATION_MAX_PARALLEL:-2}
      VALIDATION_RETENTION_HOURS: ${VALIDATION_RETENTION_HOURS:-24}
      VALIDATION_MAX_OUTPUT_KB: ${VALIDATION_MAX_OUTPUT_KB:-96}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - validation-data:/var/lib/dashboardia-validations
    networks:
      - public

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.dashboardia.app}
      PREVIEW_API_DOMAIN: ${PREVIEW_API_DOMAIN:-preview-api.dashboardia.app}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - public
      - preview

networks:
  public:
  preview:
    name: dashboardia-preview-control
    internal: true

volumes:
  preview-data:
  validation-data:
  caddy-data:
  caddy-config:
